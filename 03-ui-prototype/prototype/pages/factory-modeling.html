<div class="toast" role="status" aria-live="polite"></div><div id="confirmMask" class="modal-mask"><div class="bg-panel-bg rounded-lg border border-border w-[420px] p-5 shadow-xl"><h4 id="confirmTitle" class="font-module-header text-module-header mb-2">确认操作</h4><p id="confirmText" class="text-text-secondary ui-allow-wrap mb-5">确认继续？</p><div class="flex justify-end gap-3"><button id="confirmCancel" class="px-4 py-2 rounded-lg border border-border">取消</button><button id="confirmOk" class="px-4 py-2 rounded-lg bg-primary text-white">确认</button></div></div></div>
<script>
const root={id:'root',type:'root',code:'ROOT',name:'根节点',sort:0,status:'启用',remark:'工厂建模根节点，用于创建工厂。',expanded:true,referenced:true,children:[{id:'fac1',type:'factory',code:'FAC-001',name:'新能源一厂',sort:1,status:'启用',remark:'新能源装载机总装与测试基地',expanded:true,referenced:true,children:[{id:'ws1',type:'workshop',code:'WS-001',name:'总装一车间',sort:1,status:'启用',remark:'负责电驱装载机总装',expanded:true,referenced:true,children:[{id:'line1',type:'line',code:'LINE-A01',name:'A01产线',sort:1,status:'启用',remark:'5吨电驱装载机主产线',referenced:true,children:[]},{id:'line2',type:'line',code:'LINE-A02',name:'A02产线',sort:2,status:'启用',remark:'7吨电驱装载机产线',referenced:false,children:[]}]},{id:'ws2',type:'workshop',code:'WS-002',name:'电池装配车间',sort:2,status:'启用',remark:'负责电池包装配',expanded:true,referenced:false,children:[{id:'line3',type:'line',code:'LINE-B02',name:'B02产线',sort:1,status:'启用',remark:'电池包检测产线',referenced:false,children:[]}]}]},{id:'fac2',type:'factory',code:'FAC-002',name:'新能源二厂',sort:2,status:'停用',remark:'预留扩建工厂',expanded:true,referenced:false,children:[{id:'ws3',type:'workshop',code:'WS-009',name:'预留车间',sort:1,status:'停用',remark:'随上级停用',referenced:false,children:[]}]}]};
let selected=root,mode='detail',dirty=false,pendingAction=null;const typeName={root:'根节点',factory:'工厂',workshop:'车间',line:'产线'};
function flat(nodes=[root],arr=[]){nodes.forEach(n=>{arr.push(n);flat(n.children||[],arr)});return arr}function findParent(target,nodes=[root],parent=null){for(const n of nodes){if(n===target)return parent;const r=findParent(target,n.children||[],n);if(r)return r}return null}function effectiveStatus(n){let p=n;while(p){if(p.status==='停用')return '停用';p=findParent(p)}return '启用'}function canAddChild(n){return n.type!=='line'&&effectiveStatus(n)==='启用'}function cascadeStatus(n,status){n.status=status;(n.children||[]).forEach(c=>cascadeStatus(c,status))}
function childTypeOf(n){return n.type==='root'?'factory':n.type==='factory'?'workshop':'line'}function childLabelOf(n){return n.type==='root'?'工厂':n.type==='factory'?'车间':'产线'}
function sortedChildren(n){return [...(n.children||[])].sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0)||a.name.localeCompare(b.name,'zh-Hans-CN'))}
function nodeMatches(n,q){return !q||n.code.toLowerCase().includes(q)||n.name.toLowerCase().includes(q)}
function subtreeMatches(n,q){return nodeMatches(n,q)||sortedChildren(n).some(c=>subtreeMatches(c,q))}
function renderTree(){const q=treeSearch.value.trim().toLowerCase();function row(n,level){const kids=sortedChildren(n),eff=effectiveStatus(n);const show=subtreeMatches(n,q);if(!show)return '';const icon=n.type==='root'?'account_tree':n.type==='factory'?'factory':n.type==='workshop'?'warehouse':'precision_manufacturing';let html=`<div class="tree-row ${selected===n?'active':''} ${eff==='停用'?'disabled':''} px-2 rounded-lg cursor-pointer" onclick="selectNode('${n.id}')"><div class="flex items-center gap-2 min-w-0" style="padding-left:${8+level*18}px"><button class="tree-toggle" onclick="toggleExpand(event,'${n.id}')"><span class="material-symbols-outlined text-[18px]">${kids.length?(n.expanded||q?'expand_more':'chevron_right'):'radio_button_unchecked'}</span></button><span class="material-symbols-outlined text-[18px]">${icon}</span><span class="ui-truncate">${n.name}</span></div><span class="text-label-small text-text-secondary ui-nowrap justify-self-end">${n.code}</span><span class="status-chip ${eff==='启用'?'status-on':'status-off'} justify-self-start">${eff}</span></div>`;if((n.expanded||q)&&kids.length)kids.forEach(c=>html+=row(c,level+1));return html}tree.innerHTML=row(root,0)}window.toggleExpand=(event,id)=>{event.stopPropagation();const n=flat().find(x=>x.id===id);if(n&&(n.children||[]).length){n.expanded=!n.expanded;renderTree()}};window.selectNode=id=>{const n=flat().find(x=>x.id===id);if(n){selected=n;mode='detail';dirty=false;render()}}
function actionButtons(){const addAllowed=canAddChild(selected);const addTitle=childLabelOf(selected);actionBar.innerHTML=`${addAllowed?`<button onclick="startAdd()" class="bg-primary text-white">新增${addTitle}</button>`:''}${selected.type!=='root'?`<button onclick="startEdit()" class="border border-border text-primary bg-white">编辑</button><button onclick="toggleStatus()" class="border border-border bg-white">${selected.status==='启用'?'停用':'启用'}</button><button onclick="tryDelete()" class="border border-status-error/30 text-status-error bg-white">删除</button>`:''}${!addAllowed&&selected.type!=='line'?`<span class="text-label-small text-text-secondary ui-nowrap">停用状态不可新增下级</span>`:''}`}
function statusBadge(s){return `<span class="status-chip ${s==='启用'?'status-on':'status-off'}">${s}</span>`}
function detail(){panelTitle.textContent=`${typeName[selected.type]}详情`;panelSub.textContent=`${selected.name} / ${selected.code}`;actionButtons();const children=selected.children||[],eff=effectiveStatus(selected);content.innerHTML=`<div class="factory-detail-grid"><div class="factory-detail-card"><p class="text-label-small text-text-secondary">编码</p><p class="value ui-nowrap">${selected.code}</p></div><div class="factory-detail-card"><p class="text-label-small text-text-secondary">名称</p><p class="value ui-truncate">${selected.name}</p></div><div class="factory-detail-card"><p class="text-label-small text-text-secondary">排序号</p><p class="value">${selected.sort}</p></div><div class="factory-detail-card"><p class="text-label-small text-text-secondary">状态</p><p class="value">${statusBadge(eff)}</p></div></div><div class="factory-note"><p class="text-label-small text-text-secondary mb-1">备注</p><p class="ui-allow-wrap">${selected.remark||'无'}</p></div><div class="factory-table-card"><div class="factory-table-head"><h4 class="font-bold">下级节点</h4><span class="text-label-small text-text-secondary">${children.length} 个</span></div><table class="w-full text-left"><thead><tr class="border-b border-border"><th>编码</th><th>名称</th><th>类型</th><th>状态</th></tr></thead><tbody>${children.length?children.map(c=>`<tr class="border-b border-border hover:bg-surface-container-low cursor-pointer" onclick="selectNode('${c.id}')"><td class="ui-nowrap">${c.code}</td><td>${c.name}</td><td class="ui-nowrap">${typeName[c.type]}</td><td>${statusBadge(effectiveStatus(c))}</td></tr>`).join(''):`<tr><td class="text-text-secondary" colspan="4" style="padding:28px 12px">暂无下级节点</td></tr>`}</tbody></table></div>`}
function form(kind){const add=kind==='add';const childType=childTypeOf(selected);const target=add?{type:childType,code:'',name:'',sort:1,status:'启用',remark:''}:selected;panelTitle.textContent=add?`新增${typeName[childType]}`:`编辑${typeName[selected.type]}`;panelSub.textContent=add?`父节点：${selected.name}`:`当前节点：${selected.name}`;actionBar.innerHTML='';content.innerHTML=`<form id="nodeForm" class="factory-form"><div class="form-grid"><label class="field"><span class="text-label-small text-text-secondary">编码 *</span><input name="code" value="${target.code}" placeholder="如 FAC-001 / WS-001 / LINE-A01"/><p class="hint">编码全局唯一，导入业务数据仍按设备编码匹配。</p></label><label class="field"><span class="text-label-small text-text-secondary">名称 *</span><input name="name" value="${target.name}" placeholder="请输入名称"/></label><label class="field"><span class="text-label-small text-text-secondary">排序号 *</span><input name="sort" type="number" value="${target.sort}"/></label><label class="field"><span class="text-label-small text-text-secondary">状态</span><select name="status"><option ${target.status==='启用'?'selected':''}>启用</option><option ${target.status==='停用'?'selected':''}>停用</option></select></label><label class="field field-full"><span class="text-label-small text-text-secondary">备注</span><textarea name="remark" placeholder="请输入备注">${target.remark}</textarea></label></div><div class="factory-form-actions"><button type="button" onclick="cancelForm()" class="border border-border bg-white">取消</button><button class="bg-primary text-white">保存</button></div></form>`;nodeForm.addEventListener('input',()=>dirty=true);nodeForm.addEventListener('submit',e=>{e.preventDefault();saveForm(add,target)})}
window.startAdd=()=>{if(!canAddChild(selected)){showToast('停用状态不可新增下级');return}mode='add';dirty=false;render()};window.startEdit=()=>{mode='edit';dirty=false;render()};
function saveForm(add,target){const fd=new FormData(nodeForm);const code=fd.get('code').trim(),name=fd.get('name').trim();if(!code||!name){showToast('编码和名称必填');return}const all=flat().filter(n=>n!==target);if(all.some(n=>n.code===code)){showToast('编码已存在');return}const siblings=add?(selected.children||[]):(findParent(selected)?.children||[root]);if(siblings.some(n=>n!==target&&n.name===name)){showToast('同级名称已存在');return}if(add){selected.children=selected.children||[];selected.expanded=true;selected.children.push({id:'n'+Date.now(),type:childTypeOf(selected),code,name,sort:+fd.get('sort'),status:fd.get('status'),remark:fd.get('remark'),referenced:false,expanded:true,children:[]})}else{Object.assign(target,{code,name,sort:+fd.get('sort'),status:fd.get('status'),remark:fd.get('remark')});if(target.status==='停用')cascadeStatus(target,'停用')}mode='detail';dirty=false;showToast('保存成功');render()}
window.cancelForm=()=>{if(dirty)confirm('放弃修改确认','当前填写内容未保存，是否放弃？',()=>{mode='detail';dirty=false;render()});else{mode='detail';render()}};function confirm(title,text,ok){confirmTitle.textContent=title;confirmText.textContent=text;confirmMask.classList.add('show');pendingAction=ok}confirmCancel.onclick=()=>confirmMask.classList.remove('show');confirmOk.onclick=()=>{confirmMask.classList.remove('show');pendingAction&&pendingAction()}
window.toggleStatus=()=>confirm(`${selected.status==='启用'?'停用':'启用'}确认`,`确认${selected.status==='启用'?'停用':'启用'} ${selected.name}？${selected.status==='启用'?'停用后下级节点将全部自动停用，且不可新增下级。':''}`,()=>{const next=selected.status==='启用'?'停用':'启用';if(next==='停用')cascadeStatus(selected,'停用');else selected.status='启用';showToast('状态已更新');render()})
window.tryDelete=()=>{if((selected.children||[]).length||selected.referenced){confirm('无法删除','该节点存在下级节点或已被历史数据引用，不允许删除，请改为停用。',()=>{});return}confirm('删除确认',`确认删除 ${selected.name}？删除后不可恢复。`,()=>{const parent=findParent(selected);const arr=parent?parent.children:root.children;arr.splice(arr.indexOf(selected),1);selected=parent||root;showToast('删除成功');render()})}
expandAll.onclick=()=>{flat().forEach(n=>n.expanded=true);renderTree()};collapseAll.onclick=()=>{flat().forEach(n=>n.expanded=false);root.expanded=true;renderTree()};treeSearch.oninput=renderTree;function render(){renderTree();mode==='detail'?detail():form(mode)}render();
</script>
