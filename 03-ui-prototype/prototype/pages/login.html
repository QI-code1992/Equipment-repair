<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - 设备AI智能运维平台</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet"/>
<style>
body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}.ui-nowrap{white-space:nowrap}.ui-allow-wrap{white-space:normal;overflow-wrap:anywhere}.login-bg{min-height:100vh;background:radial-gradient(circle at 18% 18%,rgba(6,182,212,.28),transparent 30%),radial-gradient(circle at 82% 12%,rgba(0,87,194,.34),transparent 28%),linear-gradient(135deg,#061a31 0%,#0B2A4A 46%,#0f3b66 100%);position:relative;overflow:hidden}.gridline{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:52px 52px}.beam{position:absolute;width:580px;height:580px;border:1px solid rgba(175,198,255,.2);border-radius:50%;right:-160px;bottom:-220px}.beam:before,.beam:after{content:"";position:absolute;border:1px solid rgba(6,182,212,.18);border-radius:50%;inset:70px}.beam:after{inset:145px}.glass{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.65);box-shadow:0 28px 70px rgba(0,0,0,.28)}.field-wrap{position:relative}.field-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#727786;z-index:2;pointer-events:none}.input{height:46px;border:1px solid #E5EAF0;border-radius:8px;background:#F8FAFC;width:100%;outline:none;line-height:46px;font-size:14px}.field-wrap input.input{padding-left:52px!important;padding-right:54px!important}.input:focus{border-color:#0057c2;background:white;box-shadow:0 0 0 3px rgba(0,87,194,.1)}.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:transparent;color:#727786;display:flex;align-items:center;justify-content:center}.btn{height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;align-items:center;justify-content:center;z-index:50}.modal-mask.show{display:flex}@media(max-width:1100px){main{grid-template-columns:1fr!important}.login-card{max-width:420px}.feature-grid{grid-template-columns:repeat(3,1fr)!important}}
</style>
</head>
<body class="login-bg text-[#303846]"><div class="gridline"></div><div class="beam"></div>
<main class="relative z-10 min-h-screen grid grid-cols-[1fr_420px] gap-12 items-center px-[9vw]">
<section class="text-white max-w-[720px]"><div class="inline-flex items-center gap-2 h-9 px-3 rounded-full bg-white/10 border border-white/15 mb-7"><span class="material-symbols-outlined text-[#06B6D4] text-[18px]">auto_awesome</span><span class="text-sm ui-nowrap">新能源装载机设备故障智能运维平台</span></div><h1 class="text-[44px] leading-[1.15] font-bold tracking-normal mb-5">设备AI智能运维平台</h1><p class="text-[18px] leading-8 text-white/76 ui-allow-wrap">面向工厂、车间、产线的设备故障智能运维演示系统，融合台账、诊断、工单与 Agent 辅助闭环。</p><div class="feature-grid grid grid-cols-3 gap-3 mt-10 max-w-[720px]"><div class="rounded-lg bg-white/10 border border-white/15 p-4"><p class="text-[28px] font-bold">24h</p><p class="text-sm text-white/65 ui-nowrap">故障追踪</p></div><div class="rounded-lg bg-white/10 border border-white/15 p-4"><p class="text-[28px] font-bold">AI</p><p class="text-sm text-white/65 ui-nowrap">诊断辅助</p></div><div class="rounded-lg bg-white/10 border border-white/15 p-4"><p class="text-[28px] font-bold">RAG</p><p class="text-sm text-white/65 ui-nowrap">知识检索</p></div><div class="rounded-lg bg-white/10 border border-white/15 p-4"><p class="text-[28px] font-bold">KG</p><p class="text-sm text-white/65 ui-nowrap">知识图谱</p></div><div class="rounded-lg bg-white/10 border border-white/15 p-4"><p class="text-[28px] font-bold">BI</p><p class="text-sm text-white/65 ui-nowrap">驾驶舱分析</p></div><div class="rounded-lg bg-white/10 border border-white/15 p-4"><p class="text-[28px] font-bold">闭环</p><p class="text-sm text-white/65 ui-nowrap">工单协同</p></div></div></section>
<section class="login-card glass rounded-xl p-7"><div class="mb-6"><h2 class="text-[24px] leading-8 font-bold text-[#181b23]">登录</h2><p class="text-[#6B7280] text-sm mt-1">请输入账号密码进行登录</p></div><div id="err" class="hidden mb-4 rounded-lg bg-[#ffdad6] text-[#EF4444] px-3 py-2 text-sm ui-allow-wrap"></div><label class="block text-sm font-bold mb-2">账号</label><div class="field-wrap mb-4"><span class="material-symbols-outlined field-icon">person</span><input id="user" class="input" value="admin" placeholder="请输入账号"/></div><label class="block text-sm font-bold mb-2">密码</label><div class="field-wrap mb-4"><span class="material-symbols-outlined field-icon">lock</span><input id="pwd" class="input" type="password" value="admin123" placeholder="请输入密码"/><button id="eye" class="eye-btn" type="button"><span class="material-symbols-outlined">visibility</span></button></div><div class="flex items-center justify-between mb-5 text-sm"><label class="flex items-center gap-2 text-[#414755]"><input id="remember" type="checkbox" checked class="rounded border-[#c1c6d7] text-[#0057c2]"/>记住密码</label><button id="forgot" class="text-[#0057c2] font-bold" type="button">忘记密码</button></div><button id="login" class="btn w-full bg-[#0057c2] text-white font-bold">登录</button><p class="text-xs text-[#6B7280] mt-4 ui-allow-wrap">连续失败 3 次后临时锁定，锁定30s。</p></section>
</main><div id="modal" class="modal-mask"><div class="bg-white rounded-lg border border-[#E5EAF0] w-[420px] p-5 shadow-xl"><h3 class="text-[17px] font-bold mb-2">忘记密码</h3><p class="text-[#6B7280] text-sm leading-6 ui-allow-wrap">请联系系统管理员重置密码。管理员可在系统管理中启用账号并重置初始密码。</p><div class="flex justify-end mt-5"><button id="closeModal" class="btn px-4 bg-[#0057c2] text-white">知道了</button></div></div></div>
<script>let fail=0,locked=false,lockTimer=null,remain=0;const err=document.getElementById('err');function msg(t){err.textContent=t;err.classList.remove('hidden')}function lockAccount(){locked=true;remain=30;login.disabled=true;login.classList.add('opacity-60','cursor-not-allowed');msg(`账号已临时锁定，请 ${remain}s 后再试。`);lockTimer=setInterval(()=>{remain--;if(remain>0){msg(`账号已临时锁定，请 ${remain}s 后再试。`)}else{clearInterval(lockTimer);locked=false;fail=0;login.disabled=false;login.classList.remove('opacity-60','cursor-not-allowed');msg('账号锁定已解除，请重新登录。')}},1000)}eye.onclick=()=>{pwd.type=pwd.type==='password'?'text':'password';eye.querySelector('span').textContent=pwd.type==='password'?'visibility':'visibility_off'};forgot.onclick=()=>modal.classList.add('show');closeModal.onclick=()=>modal.classList.remove('show');login.onclick=()=>{if(locked){msg(`账号已临时锁定，请 ${remain}s 后再试。`);return}if(user.value.trim()==='admin'&&pwd.value==='admin123'){if(remember.checked)localStorage.setItem('zw-remember','1');location.href='workbench.html'}else{fail++;msg(`账号或密码错误，剩余 ${Math.max(0,3-fail)} 次机会。`);if(fail>=3)lockAccount()}};</script>
</body></html>
