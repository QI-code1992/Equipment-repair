services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_CERT_DIRECTORY}:/etc/nginx/certs:ro
    networks: [platform]

  api:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
      RAGFLOW_TIMEOUT_SECONDS: ${RAGFLOW_TIMEOUT_SECONDS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [platform, ragflow-egress]

  worker:
    profiles: [validation]
    build:
      context: ../backend
    command: ["python", "-m", "app.modules.knowledge.worker_main", "--poll-seconds", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [platform, ragflow-egress]

  migrate:
    profiles: [validation]
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [platform]

  validator:
    profiles: [validation]
    build:
      context: ../backend
      target: test
    command: ["python", "-m", "pytest", "tests/integration/test_task005_postgres.py", "tests/integration/test_task005_live_stack.py", "-q"]
    environment:
      TASK005_ALLOW_LIVE_TESTS: "1"
      TASK005_ALLOW_DESTRUCTIVE_TESTS: "1"
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
      TASK005_POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TASK005_MINIO_ENDPOINT: minio:9000
      TASK005_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      TASK005_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      TASK005_MINIO_BUCKET: ${MINIO_BUCKET}
      TASK005_CLAMAV_HOST: clamav
      TASK005_RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL}
      TASK005_RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [platform, ragflow-egress]

  postgres:
    image: ${DOCKER_IMAGE_PREFIX:-}postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  redis:
    image: ${DOCKER_IMAGE_PREFIX:-}redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  minio:
    profiles: [validation]
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-03-25T00-00-00Z}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  clamav:
    profiles: [validation]
    image: clamav/clamav:1.4.3
    networks: [platform]

networks:
  platform:
    internal: true
  ragflow-egress: {}
